[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ace-bench"
version = "0.1.0"
description = "Agent Code Efficiency Benchmark — structural efficiency vs human baselines"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "Rachit Rastogi", email = "rachitrastogi777@gmail.com" },
]
keywords = [
  "benchmark",
  "llm",
  "coding-agents",
  "code-efficiency",
  "ast",
  "evaluation",
]
dependencies = [
  "tree-sitter>=0.22",
  "certifi>=2024.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.scripts]
ace-harvest = "ace_bench.cli:main"

[project.urls]
Homepage = "https://github.com/rachitkumarrastogi/ace-bench"
Repository = "https://github.com/rachitkumarrastogi/ace-bench"

[tool.hatch.build.targets.wheel]
packages = ["src/ace_bench"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Keep CI signal high; defer style nits that predate this pass.
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
  "E501",    # line length — handled by formatter preference elsewhere
  "SIM114",  # combine if branches — readability in harvest status
  "UP017",   # datetime.UTC — keep timezone.utc for broader readability
]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["EXE001", "E402"]
"tests/*" = ["E501", "E402"]
